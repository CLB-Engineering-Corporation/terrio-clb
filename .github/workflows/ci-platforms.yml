name: CI (Windows, macOS on request)

# The Rust and Python jobs of ci.yml on Windows and macOS, which are slow. Windows runs on every
# push to main, and for pull requests on demand only, by hand (Actions > CI (Windows, macOS on
# request) > Run workflow) or with the label ci:windows or ci:all (when the label is added, and on
# each push while it stays).
# macOS runners are slow and expensive, so macOS never runs on its own: only by hand (choose
# macos or all) or with the label ci:macos. Neither a push to main nor ci:all includes it.
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  workflow_dispatch:
    inputs:
      platforms:
        description: "Platforms to run"
        type: choice
        options: [windows, macos, all]
        default: windows

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

# Runners: Windows runs on CLB's self-hosted Slurm runner (clb-ci-windows); pull requests from
# forks fall back to GitHub-hosted windows-latest, so they never reach a self-hosted runner. macOS
# stays GitHub-hosted, and so does the platform picker (a few seconds, no checkout: it should not
# wait for a busy self-hosted runner).
jobs:
  # The runners the labels or the manual run ask for: a JSON list, empty for none.
  platforms:
    runs-on: ubuntu-latest
    outputs:
      os: ${{ steps.pick.outputs.os }}
    steps:
      - id: pick
        env:
          EVENT: ${{ github.event_name }}
          CHOICE: ${{ inputs.platforms }}
          ACTION: ${{ github.event.action }}
          ADDED: ${{ github.event.label.name }}
          LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
        run: |
          # Adding a label other than ci:* changes nothing: no run.
          if [ "$ACTION" = labeled ] && [[ "$ADDED" != ci:* ]]; then
            echo "os=[]" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          want() {
            if [ "$EVENT" = push ]; then
              [ "$1" = windows ]
            elif [ "$EVENT" = workflow_dispatch ]; then
              [ "$CHOICE" = all ] || [ "$CHOICE" = "$1" ]
            elif [ "$1" = macos ]; then
              # ci:all does not include macOS: only its own label does.
              echo "$LABELS" | jq -e 'index("ci:macos") != null' > /dev/null
            else
              echo "$LABELS" | jq -e --arg l "ci:$1" 'index($l) != null or index("ci:all") != null' > /dev/null
            fi
          }
          os='[]'
          want macos && os=$(echo "$os" | jq -c '. + ["macos-latest"]')
          want windows && os=$(echo "$os" | jq -c '. + ["windows-latest"]')
          echo "os=$os" >> "$GITHUB_OUTPUT"
          echo "Platforms: $os"

  check:
    needs: platforms
    if: needs.platforms.outputs.os != '[]'
    concurrency:
      group: ci-platforms-check-${{ matrix.os }}-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    name: ${{ matrix.os }}
    # Fork pull requests and macOS -> GitHub-hosted matrix.os; Windows otherwise self-hosted.
    runs-on: ${{ fromJSON((github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository || matrix.os != 'windows-latest') && format('["{0}"]', matrix.os) || '["self-hosted", "Windows", "X64", "clb-ci-windows"]') }}
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.platforms.outputs.os) }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      # Self-hosted Windows (CARGO_HOME=C:\rust\cargo) can have rustup on PATH without the
      # cargo/rustc proxies: put the selected toolchain's directory on PATH for later steps.
      - name: Put the toolchain's cargo on PATH
        shell: bash
        run: |
          cargo_exe="$(rustup which cargo)"
          cargo_exe="${cargo_exe//\\//}"
          echo "${cargo_exe%/*}" >> "$GITHUB_PATH"
      - uses: Swatinem/rust-cache@v2
        with:
          # Never restore Cargo's bin folder: the self-hosted Windows image keeps rustup's
          # proxies there.
          cache-bin: "false"
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  python:
    needs: platforms
    if: needs.platforms.outputs.os != '[]'
    concurrency:
      group: ci-platforms-python-${{ matrix.os }}-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    name: python (${{ matrix.os }})
    # Fork pull requests and macOS -> GitHub-hosted matrix.os; Windows otherwise self-hosted.
    runs-on: ${{ fromJSON((github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository || matrix.os != 'windows-latest') && format('["{0}"]', matrix.os) || '["self-hosted", "Windows", "X64", "clb-ci-windows"]') }}
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.platforms.outputs.os) }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      # maturin-action uses the toolchain on PATH; on the self-hosted Windows image put cargo there.
      - uses: dtolnay/rust-toolchain@stable
        if: runner.os == 'Windows'
      # Self-hosted Windows (CARGO_HOME=C:\rust\cargo) can have rustup on PATH without the
      # cargo/rustc proxies: put the selected toolchain's directory on PATH for later steps.
      - name: Put the toolchain's cargo on PATH
        if: runner.os == 'Windows'
        shell: bash
        run: |
          cargo_exe="$(rustup which cargo)"
          cargo_exe="${cargo_exe//\\//}"
          echo "${cargo_exe%/*}" >> "$GITHUB_PATH"
      - name: Build the wheel
        uses: PyO3/maturin-action@v1
        with:
          working-directory: python
          args: --release --out dist
          manylinux: auto
          sccache: true
      - name: Install the wheel
        shell: bash
        # rasterio (with its bundled GDAL) and shapely: terrio.rio is compared with rasterio.
        # xarray, dask, rioxarray, zarr and scipy: terrio.xarray is compared with rioxarray.
        run: python -m pip install pytest rasterio shapely xarray "dask[array]" rioxarray zarr scipy python/dist/*.whl
      - name: Test
        timeout-minutes: 15
        working-directory: python
        run: python -m pytest -v -o faulthandler_timeout=60
      - uses: actions/upload-artifact@v7
        with:
          name: wheel-${{ matrix.os }}
          path: python/dist/*.whl
