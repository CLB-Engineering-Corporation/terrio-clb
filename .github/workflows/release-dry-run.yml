name: Release dry run

# Builds and checks everything a release publishes, without publishing: the wheels for every
# platform, the source distribution, the Pyodide wheel and the command-line binaries
# (release-build.yml, as the release builds them), the crates as `cargo publish` packages and
# verifies them, the npm package, and that LICENSE-THIRD-PARTY.md is up to date.
# Run by hand before tagging a release (Actions > Release dry run > Run workflow).
# Pull requests use the normal CI build, API, Python and WASM packaging checks.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-dry-run-${{ github.ref }}
  cancel-in-progress: true

# Runners: the crates and licenses checks run on CLB's self-hosted Slurm runner (clb-ci-linux),
# and so do the self-hosted jobs of release-build.yml. Dispatched by hand only: no fork pull request
# reaches these jobs.
jobs:
  build:
    uses: ./.github/workflows/release-build.yml

  crates:
    runs-on: ["self-hosted", "Linux", "X64", "clb-ci-linux"]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # CLB build (terrio-clb): the crates depend on `zstd-rust` from git, which `cargo publish`
      # refuses, and terrio-clb publishes no crates (release.yml). Their file lists are checked,
      # and the build verified.
      - name: Package terrio-crs, terrio and terrio-cli (file lists) and build them
        run: |
          cargo package --list --locked -p terrio-crs -p terrio -p terrio-cli
          cargo build --locked -p terrio-crs -p terrio -p terrio-cli

  # LICENSE-THIRD-PARTY.md, which the packages ship, lists the dependencies being released.
  licenses:
    runs-on: ["self-hosted", "Linux", "X64", "clb-ci-linux"]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          # Pinned: the generated file depends on cargo-about's version and license data.
          tool: cargo-about@0.9.2
      - name: Check that LICENSE-THIRD-PARTY.md is up to date
        run: |
          cargo about generate --locked --all-features --fail about.hbs -o LICENSE-THIRD-PARTY.md
          git diff --exit-code LICENSE-THIRD-PARTY.md

  # GitHub-hosted: it installs clang 20 with root apt, which the self-hosted runner cannot.
  npm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # The threaded and memory64 modules (js/build.mjs): the nightly it pins, with the standard
      # library's sources.
      # Installed first: the last toolchain installed is the default (stable).
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-10-15
          targets: wasm32-unknown-unknown
          components: rust-src
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      # The memory64 module's C code (Zstandard) needs clang 20 or later (js/build.mjs).
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq clang-20
      - name: Build the package as the release does
        run: |
          node js/build.mjs
          node .github/scripts/npm-notices.mjs js/pkg
      - name: Check its name and version, and pack it
        working-directory: js/pkg
        run: |
          name=$(node -p "require('./package.json').name")
          version=$(node -p "require('./package.json').version")
          expected=$(cargo metadata --no-deps --format-version 1 --manifest-path ../../Cargo.toml | jq -r '.packages[] | select(.name == "terrio") | .version')
          echo "$name $version (terrio $expected)"
          test "$name" = terrio-js
          test "$version" = "$expected"
          npm pack --dry-run
